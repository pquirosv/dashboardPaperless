name: dashboard-example

services:
  dashboard:
    image: dashboard-paperless:example
    build:
      context: ..
    pull_policy: build
    init: true
    restart: on-failure:3
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      APP_MODE: docker-local
      APP_TITLE: Dashboard Paperless · Demo
      SOURCE_LABEL: Origen de ejemplo
      BACKUP_LABEL: Referencia de ejemplo
      INVENTORY_EXISTS: "true"
      INVENTORY_FILE: /input/inventory.json
      SOURCE_FILES_ROOT: /documents/source
      BACKUP_FILES_ROOT: /documents/backup
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:4173"
    volumes:
      - type: bind
        source: ../test/fixtures/sample-inventory-v1.json
        target: /input/inventory.json
        read_only: true
      - type: bind
        source: ../test/fixtures
        target: /documents/source
        read_only: true
      - type: bind
        source: ../test/fixtures
        target: /documents/backup
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
