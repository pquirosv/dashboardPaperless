services:
  dashboard:
    # Imagen y etiqueta publicadas en el registro de contenedores.
    image: "${DASHBOARD_IMAGE:?Define DASHBOARD_IMAGE en .env}:${DASHBOARD_VERSION:?Define DASHBOARD_VERSION en .env}"

    # Permite que Docker gestione correctamente las señales y los procesos hijos.
    init: true
    # Reinicia el servicio solo cuando termina con error, como máximo tres veces.
    restart: on-failure:3
    # La aplicación no necesita escribir en su sistema de archivos.
    read_only: true
    # Elimina todas las capacidades Linux que no necesita el servidor.
    cap_drop:
      - ALL
    # Impide que el proceso obtenga privilegios adicionales.
    security_opt:
      - no-new-privileges:true

    environment:
      # Texto visible en la cabecera del dashboard.
      APP_TITLE: "${APP_TITLE:?Define APP_TITLE en .env}"
      # Etiqueta visible para los documentos de origen.
      SOURCE_LABEL: "${SOURCE_LABEL:?Define SOURCE_LABEL en .env}"
      # Etiqueta visible para los documentos de referencia.
      BACKUP_LABEL: "${BACKUP_LABEL:?Define BACKUP_LABEL en .env}"
      # Rutas internas del contenedor; no son rutas del equipo anfitrión.
      INVENTORY_FILE: /input/inventory.txt
      SOURCE_FILES_ROOT: /documents/source
      BACKUP_FILES_ROOT: /documents/backup

    ports:
      # Publica el puerto interno 4173 en la dirección y puerto definidos en .env.
      - "${DASHBOARD_HOST_BIND:?Define DASHBOARD_HOST_BIND en .env}:${DASHBOARD_PORT:?Define DASHBOARD_PORT en .env}:4173"

    volumes:
      # Monta el informe del equipo anfitrión como solo lectura.
      - type: bind
        source: "${INVENTORY_FILE_HOST:?Define INVENTORY_FILE_HOST en .env}"
        target: /input/inventory.txt
        read_only: true
      # Monta los documentos de origen sin copiarlos a la imagen.
      - type: bind
        source: "${SOURCE_DIRECTORY_HOST:?Define SOURCE_DIRECTORY_HOST en .env}"
        target: /documents/source
        read_only: true
      # Monta los documentos de referencia sin copiarlos a la imagen.
      - type: bind
        source: "${BACKUP_DIRECTORY_HOST:?Define BACKUP_DIRECTORY_HOST en .env}"
        target: /documents/backup
        read_only: true

    # Proporciona espacio temporal escribible sin alterar la imagen ni el host.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
