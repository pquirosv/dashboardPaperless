name: Test and publish container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
      - run: npm test
      - run: docker build --tag document-dashboard:test .

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate version change
        id: check
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const fail = (message) => {
            console.error(`Invalid version change: ${message}`);
            process.exit(1);
          };
          const valid = (value) => /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(value);
          const current = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (!valid(current)) fail(`package.json version "${current}" must use X.Y.Z format.`);

          const tags = execFileSync('git', ['tag', '--list', 'v*', '--sort=-version:refname'], { encoding: 'utf8' })
            .trim().split('\n').filter((tag) => /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag));
          if (tags.length === 0) fail('no existing vX.Y.Z tag was found to compare against.');

          const previous = tags[0].slice(1);
          if (current === previous) {
            console.log(`Version unchanged at ${current}; this push will not publish a package.`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
            process.exit(0);
          }

          const [oldMajor, oldMinor, oldPatch] = previous.split('.').map(Number);
          const [major, minor, patch] = current.split('.').map(Number);
          let kind;
          if (major === oldMajor && minor === oldMinor && patch === oldPatch + 1) kind = 'patch';
          else if (major === oldMajor && minor === oldMinor + 1 && patch === 0) kind = 'minor';
          else if (major === oldMajor + 1 && minor === 0 && patch === 0) kind = 'major';
          else fail(`v${current} must be exactly one patch, minor, or major increment from v${previous} (minor resets patch to 0; major resets minor and patch to 0).`);

          const existing = execFileSync('git', ['tag', '--list', `v${current}`], { encoding: 'utf8' }).trim();
          if (existing) fail(`tag v${current} already exists.`);
          console.log(`Valid ${kind} increment: v${previous} -> v${current}.`);
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=true\nversion=${current}\n`);
          NODE

  publish-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.publish == 'true'
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish version
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dashboardpaperless:${{ needs.version.outputs.version }}
      - name: Create and push version tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate semantic version tag
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dashboardpaperless
          tags: type=ref,event=tag
      - name: Build and publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
